services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_admission
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives `docker compose down`
    ports:
      - "5433:5432"   # 5433 on host so it does not clash with a local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_CONNECTION_STRING: Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgres
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://localhost:8080   # URL the *browser* uses to reach the backend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
